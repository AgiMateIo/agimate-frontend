<!-- AgiMate mark — a diamond over two chevrons over two diamonds, all on one
     45-degree grid. Every edge is parallel or perpendicular to every other, the
     chevrons meet at a true right angle, and the four gaps are the same 6.36
     stripe. The three diamonds are one shape used three times, their centres an
     equilateral triangle of side 62.22; the two chevrons are one shape used
     twice, 23.5 apart. Rhythm down the axis: diamond 29, gap 9, arm 14.5, gap 9,
     arm 14.5. Corners rounded 2.5 throughout. viewBox is the tight ink box,
     hence the negative origin.
     Two inks alternate down the stack — diamond, chevron, chevron, diamonds —
     both indigo, a step apart in lightness. The themes use DIFFERENT steps and
     have to: on the dark ground a light ink only gains contrast (indigo-300 is
     at 9.67), on the light ground it loses it fast (indigo-300 falls to 1.86 and
     vanishes). Dark pairs 500 with 300, light pairs 600 with 400, so the felt
     strength matches — luminance ratio 2.24 against 2.11. Light-theme indigo-400
     sits at 2.79 against its ground, just under the 3.0 non-text bar; that bar
     exempts logotypes, but do not reuse this ink for anything that must meet it.
     Not the same drawing as src/components/ui/Logo.tsx, which is single-colour
     by contract (currentColor, and the landing header animates it on hover).
     Reconcile the two before treating either as canonical. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4.57 -1.71 89.15 80.82" role="img" aria-label="AgiMate">
  <style>
    /* dark is the default; light shifts both inks a step darker (globals.css) */
    .agimate-ink       { fill: #6366f1; }  /* indigo-500 */
    .agimate-ink-light { fill: #a5b4fc; }  /* indigo-300 */
    @media (prefers-color-scheme: light) {
      .agimate-ink       { fill: #4f46e5; }  /* indigo-600 */
      .agimate-ink-light { fill: #818cf8; }  /* indigo-400 */
    }
  </style>
  <path class="agimate-ink-light" d="M38.23 -0.98 A2.5 2.5 0 0 1 41.77 -0.98 L52.73 9.98 A2.5 2.5 0 0 1 52.73 13.52 L41.77 24.48 A2.5 2.5 0 0 1 38.23 24.48 L27.27 13.52 A2.5 2.5 0 0 1 27.27 9.98 Z" />
  <path class="agimate-ink" d="M10.27 20.02 A2.5 2.5 0 0 1 10.27 16.48 L13.98 12.77 A2.5 2.5 0 0 1 17.52 12.77 L38.23 33.48 A2.5 2.5 0 0 0 41.77 33.48 L62.48 12.77 A2.5 2.5 0 0 1 66.02 12.77 L69.73 16.48 A2.5 2.5 0 0 1 69.73 20.02 L41.77 47.98 A2.5 2.5 0 0 1 38.23 47.98 Z" />
  <path class="agimate-ink-light" d="M10.27 43.52 A2.5 2.5 0 0 1 10.27 39.98 L13.98 36.27 A2.5 2.5 0 0 1 17.52 36.27 L38.23 56.98 A2.5 2.5 0 0 0 41.77 56.98 L62.48 36.27 A2.5 2.5 0 0 1 66.02 36.27 L69.73 39.98 A2.5 2.5 0 0 1 69.73 43.52 L41.77 71.48 A2.5 2.5 0 0 1 38.23 71.48 Z" />
  <path class="agimate-ink" d="M7.12 52.91 A2.5 2.5 0 0 1 10.66 52.91 L21.62 63.87 A2.5 2.5 0 0 1 21.62 67.41 L10.66 78.37 A2.5 2.5 0 0 1 7.12 78.37 L-3.84 67.41 A2.5 2.5 0 0 1 -3.84 63.87 Z
           M69.34 52.91 A2.5 2.5 0 0 1 72.88 52.91 L83.84 63.87 A2.5 2.5 0 0 1 83.84 67.41 L72.88 78.37 A2.5 2.5 0 0 1 69.34 78.37 L58.38 67.41 A2.5 2.5 0 0 1 58.38 63.87 Z" />
</svg>
