<!-- AgiMate mark — a diamond over two chevrons over two diamonds, all on one
     45-degree grid. Every edge is parallel or perpendicular to every other, the
     chevrons meet at a true right angle, and the four gaps are the same 6.36
     stripe. The three diamonds are one shape used three times, their centres an
     equilateral triangle of side 62.22; the two chevrons are one shape used
     twice, 23.5 apart. Rhythm down the axis: diamond 29, gap 9, arm 14.5, gap 9,
     arm 14.5. viewBox is the tight ink box, hence the negative origin.
     Corners are rounded 5 — and 5 is near the ceiling, not a free parameter. The
     45-degree cut at each arm tip is only 10.25 long and both its corners eat r,
     so anything above 5.127 makes the path cross itself. Raising the radius is
     what warms the mark; there is no room left to warm it further this way.
     Two inks alternate down the stack, both indigo, a step apart in lightness.
     The themes use DIFFERENT steps and have to: on the dark ground a light ink
     only gains contrast, on the light ground it loses it fast. Dark pairs 500
     with 300, light pairs 600 with 400 — luminance ratio 2.24 against 2.11.
     Not the same drawing as src/components/ui/Logo.tsx, which is single-colour
     by contract (currentColor, and the landing header animates it on hover). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.54 -0.68 87.08 78.75" role="img" aria-label="AgiMate">
  <style>
    /* dark is the default; light shifts both inks a step darker (globals.css) */
    .agimate-ink       { fill: #228391; }  /* teal-500 */
    .agimate-ink-light { fill: #3cc8de; }  /* teal-300 */
    @media (prefers-color-scheme: light) {
      .agimate-ink       { fill: #1c6975; }  /* teal-600 */
      .agimate-ink-light { fill: #1fa4b8; }  /* teal-400 */
    }
  </style>
  <path class="agimate-ink-light" d="M36.46 0.79 A5.0 5.0 0 0 1 43.54 0.79 L50.96 8.21 A5.0 5.0 0 0 1 50.96 15.29 L43.54 22.71 A5.0 5.0 0 0 1 36.46 22.71 L29.04 15.29 A5.0 5.0 0 0 1 29.04 8.21 Z" />
  <path class="agimate-ink" d="M10.27 20.02 A5.0 5.0 0 0 1 10.27 16.48 L13.98 12.77 A5.0 5.0 0 0 1 17.52 12.77 L38.23 33.48 A5.0 5.0 0 0 0 41.77 33.48 L62.48 12.77 A5.0 5.0 0 0 1 66.02 12.77 L69.73 16.48 A5.0 5.0 0 0 1 69.73 20.02 L41.77 47.98 A5.0 5.0 0 0 1 38.23 47.98 Z" />
  <path class="agimate-ink-light" d="M10.27 43.52 A5.0 5.0 0 0 1 10.27 39.98 L13.98 36.27 A5.0 5.0 0 0 1 17.52 36.27 L38.23 56.98 A5.0 5.0 0 0 0 41.77 56.98 L62.48 36.27 A5.0 5.0 0 0 1 66.02 36.27 L69.73 39.98 A5.0 5.0 0 0 1 69.73 43.52 L41.77 71.48 A5.0 5.0 0 0 1 38.23 71.48 Z" />
