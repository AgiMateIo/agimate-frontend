<!-- AgiMate mark — a diamond over one chevron over two diamonds, all on one
     45-degree grid. Every edge is parallel or perpendicular to every other, the
     chevron meets at a true right angle, and the three gaps are the same 6.36
     stripe. The three diamonds are one shape used three times, their centres an
     equilateral triangle of side 49.05. Rhythm down the axis: diamond 29, gap 9,
     chevron 20. The arm tips end on the same vertical as the lower diamonds'
     outer corners (x 0.98 / 79.02), so chevron and diamonds set the width
     together — that is what fixes the arm length, it is not a free parameter.
     viewBox is the tight ink box, hence the negative origin.
     One chevron rather than two: the second one stopped reading at about 48 px
     but still cost a fourth 6.36 gap, and the pair read as a double down-arrow.
     Merging the pair into one 20-thick arm is also what warms the mark: the
     45-degree cut at each tip is now 14.14 long instead of 10.25, both its
     corners eat r, so the radius ceiling went 5.127 -> 7.07 and the corners
     could go 5 -> 6.5. There is no room left to warm it further this way.
     The two teal inks no longer alternate between shapes — they run INSIDE each
     shape, as one objectBoundingBox ramp reused by all four (hence one gradient,
     four bounding boxes, four facets). The pair and the reason for it are
     unchanged: the themes use DIFFERENT steps and have to, since on the dark
     ground a light ink only gains contrast and on the light ground it loses it
     fast. Dark ramps 300 -> 500, light ramps 400 -> 600.
     What this costs: nothing separates the chevron from the diamonds any more
     except the 6.36 gap, so below ~40 px the mark reads as one tone. That is
     fine on ground that shows through the gaps, and it is why the gaps may not
     shrink further.
     Not the same drawing as src/components/ui/Logo.tsx, which is single-colour
     by contract (currentColor, and the landing header animates it on hover) —
     that file carries the same facet ramp built out of currentColor instead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.67 -0.06 72.66 66.09" role="img" aria-label="AgiMate">
  <style>
    /* dark is the default; light shifts both ends a step darker (globals.css) */
    .agimate-facet-from { stop-color: #3cc8de; }  /* teal-300 */
    .agimate-facet-to   { stop-color: #228391; }  /* teal-500 */
    @media (prefers-color-scheme: light) {
      .agimate-facet-from { stop-color: #1fa4b8; }  /* teal-400 */
      .agimate-facet-to   { stop-color: #1c6975; }  /* teal-600 */
    }
  </style>
  <defs>
    <!-- objectBoundingBox: every shape gets the ramp across its own box, so the
         light corner of each facet points the same way, up and to the left. -->
    <linearGradient id="agimate-facet" x1="0" y1="0" x2="1" y2="1">
      <stop class="agimate-facet-from" offset="0" />
      <stop class="agimate-facet-to" offset="1" />
    </linearGradient>
  </defs>
  <path fill="url(#agimate-facet)" d="M5.57 20.82 A6.5 6.5 0 0 1 5.57 11.63 L6.38 10.82 A6.5 6.5 0 0 1 15.57 10.82 L35.4 30.65 A6.5 6.5 0 0 0 44.6 30.65 L64.43 10.82 A6.5 6.5 0 0 1 73.62 10.82 L74.43 11.63 A6.5 6.5 0 0 1 74.43 20.82 L44.6 50.65 A6.5 6.5 0 0 1 35.4 50.65 Z" />
  <path fill="url(#agimate-facet)" d="M35.4 1.85 A6.5 6.5 0 0 1 44.6 1.85 L49.9 7.15 A6.5 6.5 0 0 1 49.9 16.35 L44.6 21.65 A6.5 6.5 0 0 1 35.4 21.65 L30.1 16.35 A6.5 6.5 0 0 1 30.1 7.15 Z" />
  <path fill="url(#agimate-facet)" d="M10.88 44.32 A6.5 6.5 0 0 1 20.07 44.32 L25.38 49.63 A6.5 6.5 0 0 1 25.38 58.82 L20.07 64.13 A6.5 6.5 0 0 1 10.88 64.13 L5.57 58.82 A6.5 6.5 0 0 1 5.57 49.63 Z" />
  <path fill="url(#agimate-facet)" d="M59.93 44.32 A6.5 6.5 0 0 1 69.12 44.32 L74.43 49.63 A6.5 6.5 0 0 1 74.43 58.82 L69.12 64.13 A6.5 6.5 0 0 1 59.93 64.13 L54.62 58.82 A6.5 6.5 0 0 1 54.62 49.63 Z" />
</svg>
