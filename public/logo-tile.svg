<!-- AgiMate app tile — the mark inset in the site palette. The mark is white on
     the accent plate, so its two inks cannot both be hues: the second band is the
     same white at 0.62 alpha, the same derivation Logo.tsx uses and for the same
     reason (nothing is lighter than white). The brighter band is the top diamond
     and the lower chevron, matching public/logo-mark.svg.
     The mark is placed by transform rather than baked coordinates, which keeps
     this file diffable against logo-mark.svg. Scale 0.91872 holds the old 24 of
     side padding; the vertical padding falls out of centring. Both were
     recomputed when the corner radius went to 5 and the ink box shrank. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AgiMate">
  <style>
    /* globals.css: dark is the default, light comes from prefers-color-scheme */
    .agimate-tile { fill: #228391; }
    .agimate-mark { fill: #ffffff; }
    @media (prefers-color-scheme: light) {
      .agimate-tile { fill: #1c6975; }
    }
  </style>
  <rect class="agimate-tile" width="128" height="128" />
  <g transform="translate(27.25 28.45) scale(0.91872)">
    <!-- top diamond + lower chevron: the brighter band, as in the standalone mark -->
    <path class="agimate-mark" d="M36.46 0.79 A5.0 5.0 0 0 1 43.54 0.79 L50.96 8.21 A5.0 5.0 0 0 1 50.96 15.29 L43.54 22.71 A5.0 5.0 0 0 1 36.46 22.71 L29.04 15.29 A5.0 5.0 0 0 1 29.04 8.21 Z
         M10.27 43.52 A5.0 5.0 0 0 1 10.27 39.98 L13.98 36.27 A5.0 5.0 0 0 1 17.52 36.27 L38.23 56.98 A5.0 5.0 0 0 0 41.77 56.98 L62.48 36.27 A5.0 5.0 0 0 1 66.02 36.27 L69.73 39.98 A5.0 5.0 0 0 1 69.73 43.52 L41.77 71.48 A5.0 5.0 0 0 1 38.23 71.48 Z" />
    <!-- upper chevron + the two bottom diamonds -->
    <path class="agimate-mark" fill-opacity="0.62" d="M10.27 20.02 A5.0 5.0 0 0 1 10.27 16.48 L13.98 12.77 A5.0 5.0 0 0 1 17.52 12.77 L38.23 33.48 A5.0 5.0 0 0 0 41.77 33.48 L62.48 12.77 A5.0 5.0 0 0 1 66.02 12.77 L69.73 16.48 A5.0 5.0 0 0 1 69.73 20.02 L41.77 47.98 A5.0 5.0 0 0 1 38.23 47.98 Z
         M5.35 54.68 A5.0 5.0 0 0 1 12.43 54.68 L19.85 62.1 A5.0 5.0 0 0 1 19.85 69.18 L12.43 76.6 A5.0 5.0 0 0 1 5.35 76.6 L-2.07 69.18 A5.0 5.0 0 0 1 -2.07 62.1 Z
         M67.57 54.68 A5.0 5.0 0 0 1 74.65 54.68 L82.07 62.1 A5.0 5.0 0 0 1 82.07 69.18 L74.65 76.6 A5.0 5.0 0 0 1 67.57 76.6 L60.15 69.18 A5.0 5.0 0 0 1 60.15 62.1 Z" />
  </g>
</svg>
