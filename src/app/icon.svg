<!-- Favicon: the mark alone, one flat ink, on transparency — no plate, no ramp.
     Flat rather than the faceted ramp public/logo-mark.svg carries, because a tab
     renders this at 16-20px: a gradient is invisible below about 40px, and its
     dark end only spends contrast the mark needs against the tab strip. Same
     reason the two-tone version was refused here before the ramp existed.
     Square viewBox with the mark edge to edge horizontally and centred
     vertically — a favicon wants every pixel it can get.
     Theme-aware: teal-600 on a light tab (5.87 against it), teal-500 on a dark
     one (4.32). Firefox and Chrome honour prefers-color-scheme inside an SVG
     favicon; anything that does not falls back to the dark value, which still
     holds 4.17 against a light strip.
     src/app/favicon.ico is the fallback for Safari and older browsers and cannot
     carry a media query — it is the same mark in the single dark-theme ink. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.67 -3.35 72.66 72.66" role="img" aria-label="AgiMate">
  <style>
    .agimate-mark { fill: #228391; }
    @media (prefers-color-scheme: light) { .agimate-mark { fill: #1c6975; } }
  </style>
  <path class="agimate-mark" d="M5.57 20.82 A6.5 6.5 0 0 1 5.57 11.63 L6.38 10.82 A6.5 6.5 0 0 1 15.57 10.82 L35.4 30.65 A6.5 6.5 0 0 0 44.6 30.65 L64.43 10.82 A6.5 6.5 0 0 1 73.62 10.82 L74.43 11.63 A6.5 6.5 0 0 1 74.43 20.82 L44.6 50.65 A6.5 6.5 0 0 1 35.4 50.65 Z
           M35.4 1.85 A6.5 6.5 0 0 1 44.6 1.85 L49.9 7.15 A6.5 6.5 0 0 1 49.9 16.35 L44.6 21.65 A6.5 6.5 0 0 1 35.4 21.65 L30.1 16.35 A6.5 6.5 0 0 1 30.1 7.15 Z
           M10.88 44.32 A6.5 6.5 0 0 1 20.07 44.32 L25.38 49.63 A6.5 6.5 0 0 1 25.38 58.82 L20.07 64.13 A6.5 6.5 0 0 1 10.88 64.13 L5.57 58.82 A6.5 6.5 0 0 1 5.57 49.63 Z
           M59.93 44.32 A6.5 6.5 0 0 1 69.12 44.32 L74.43 49.63 A6.5 6.5 0 0 1 74.43 58.82 L69.12 64.13 A6.5 6.5 0 0 1 59.93 64.13 L54.62 58.82 A6.5 6.5 0 0 1 54.62 49.63 Z" />
