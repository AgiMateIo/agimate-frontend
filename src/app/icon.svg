<!-- Favicon: the mark alone, one ink, on transparency — no plate.
     One ink rather than two because a tab renders this at 16-20px, and that is
     below the 24px floor the two-tone mark needs: at 16px the light band drops
     out entirely against a light tab strip and the mark reads as fragments.
     This is the same rule the brand guidelines state; the plated version used to
     hide it, because the plate carried the recognition instead of the bands.
     Square viewBox with the mark edge to edge horizontally and centred
     vertically — a favicon wants every pixel it can get.
     Theme-aware: indigo-600 on a light tab (5.87 against it), indigo-500 on a
     dark one (4.32). Firefox and Chrome honour prefers-color-scheme inside an
     SVG favicon; anything that does not falls back to the dark value, which
     still holds 4.17 against a light strip.
     src/app/favicon.ico is the fallback for Safari and older browsers and cannot
     carry a media query — it is the same mark in the single dark-theme ink. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.54 -4.85 87.08 87.08" role="img" aria-label="AgiMate">
  <style>
    .agimate-mark { fill: #228391; }
    @media (prefers-color-scheme: light) { .agimate-mark { fill: #1c6975; } }
  </style>
